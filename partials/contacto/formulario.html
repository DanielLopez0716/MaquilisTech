<section class="p-4 bg-light rounded shadow-sm" aria-labelledby="form-titulo">
    <h2 id="form-titulo" class="h4 mb-4 text-coral">Formulario de Solicitud</h2>

    <div id="alertaContacto" role="status" aria-live="polite"></div>

    <form id="formContacto" novalidate>
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Jesús Menéndez"
                   required minlength="3" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü\s.'\-]{3,}">
            <div class="invalid-feedback">Ingresa tu nombre completo (solo letras, mínimo 3 caracteres).</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="correo">Correo Electrónico Empresarial</label>
            <input type="email" id="correo" name="correo" class="form-control" placeholder="ejemplo@empresa.com" required>
            <div class="invalid-feedback">Ingresa un correo válido, por ejemplo nombre@empresa.com.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="sector">Sector Comercial</label>
            <select id="sector" name="sector" class="form-select" required>
                <option value="" selected disabled>Selecciona un sector</option>
                <option>Servicios Financieros</option>
                <option>Comercio / Retail</option>
                <option>Logística</option>
                <option>Otro sector</option>
            </select>
            <div class="invalid-feedback">Selecciona el sector de tu empresa.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="mensaje">Mensaje o Requerimiento</label>
            <textarea id="mensaje" name="mensaje" class="form-control" rows="4" required minlength="10"
                      placeholder="Cuéntanos qué procesos repetitivos deseas automatizar en tu empresa..."></textarea>
            <div class="invalid-feedback">Cuéntanos tu requerimiento (mínimo 10 caracteres).</div>
        </div>
        <button type="submit" class="btn btn-coral w-100 py-2">Enviar Solicitud</button>
    </form>
</section>
