<section class="container py-5" aria-labelledby="galeria-titulo">
    <div class="text-center mb-5">
        <h2 id="galeria-titulo">Galería</h2>
        <p class="text-muted">Así se ven nuestras soluciones en acción.</p>
    </div>

    <!-- Carrusel de banners -->
    <div id="carruselBanners" class="carousel slide mb-5 shadow rounded overflow-hidden" data-bs-ride="carousel" aria-label="Banners de MaquilisTech">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carruselBanners" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Banner 1"></button>
            <button type="button" data-bs-target="#carruselBanners" data-bs-slide-to="1" aria-label="Banner 2"></button>
            <button type="button" data-bs-target="#carruselBanners" data-bs-slide-to="2" aria-label="Banner 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/banner-principal.svg" class="d-block w-100" alt="Árbol de maquilishuat formado por circuitos y flores, símbolo de la marca MaquilisTech">
                <div class="carousel-caption">
                    <h3 class="h4">Harvesting Innovation</h3>
                    <p class="mb-0">Agentes de IA que transforman tu negocio.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/atencion-cliente.svg" class="d-block w-100" alt="Agente de IA conversando con clientes mediante mensajes de chat, disponible las 24 horas">
                <div class="carousel-caption">
                    <h3 class="h4">Atención automatizada al cliente</h3>
                    <p class="mb-0">Con disponibilidad 24/7 cuando el proceso lo permita.</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/analisis-datos.svg" class="d-block w-100" alt="Panel de análisis de datos con gráficos de barras, línea y circular">
                <div class="carousel-caption">
                    <h3 class="h4">Análisis de datos empresariales</h3>
                    <p class="mb-0">Generación automática de reportes y apoyo al análisis.</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carruselBanners" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carruselBanners" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <!-- Galería de imágenes -->
    <div class="row g-3">
        <div class="col-6 col-lg-3">
            <figure class="m-0">
                <img src="img/atencion-cliente.svg" class="img-fluid rounded shadow-sm" alt="Atención al cliente con inteligencia artificial" loading="lazy">
                <figcaption class="small text-muted mt-2">Atención al cliente con IA</figcaption>
            </figure>
        </div>
        <div class="col-6 col-lg-3">
            <figure class="m-0">
                <img src="img/automatizacion.svg" class="img-fluid rounded shadow-sm" alt="Engranajes y documentos que representan la automatización de procesos" loading="lazy">
                <figcaption class="small text-muted mt-2">Automatización de procesos</figcaption>
            </figure>
        </div>
        <div class="col-6 col-lg-3">
            <figure class="m-0">
                <img src="img/analisis-datos.svg" class="img-fluid rounded shadow-sm" alt="Gráficos de análisis de datos empresariales" loading="lazy">
                <figcaption class="small text-muted mt-2">Análisis de datos empresariales</figcaption>
            </figure>
        </div>
        <div class="col-6 col-lg-3">
            <figure class="m-0">
                <img src="img/proceso-implementacion.svg" class="img-fluid rounded shadow-sm" alt="Cinco etapas numeradas del proceso de implementación" loading="lazy">
                <figcaption class="small text-muted mt-2">Proceso de implementación</figcaption>
            </figure>
        </div>
    </div>
</section>
